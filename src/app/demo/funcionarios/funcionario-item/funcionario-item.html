<div id="funcionario" class="card card-style2" style="border-radius: 50px 50px 20px 20px !important">
  <div class="card-body" (click)="detalhar(funcionario)">
    <h5 class="card-title">Funcionário</h5>
    <ul>
      <li>{{funcionario.nome}}</li>
      <li>{{funcionario.cpf}}</li>
      <li>{{funcionario.data}}</li>
      <li>{{funcionario.telefone}}</li>
    </ul>
  </div>
</div>
