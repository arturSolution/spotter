<div class="container-fluid">
  <div class="row">
    <div class="col-sm-12">
      <div class="card">
        <div class="card-header">
          <h5>Lista de Funcionários</h5>
          <div class="card-header-right">
            <button class="btn btn-primary" (click)="adicionarFuncionario()">
              <i class="fa fa-plus"></i>
              Adicionar Funcionário
            </button>
          </div>
        </div>
        <div class="card-body">
          <!-- Loading -->
          <div *ngIf="loading" class="text-center">
            <div class="spinner-border" role="status">
              <span class="sr-only">Carregando...</span>
            </div>
            <p>Carregando funcionários...</p>
          </div>

          <!-- Error -->
          <div *ngIf="error" class="alert alert-danger">
            {{ error }}
            <button class="btn btn-sm btn-outline-danger ml-2" (click)="carregarFuncionarios()">Tentar Novamente</button>
          </div>

          <!-- Lista de funcionários -->
          <div *ngIf="!loading && !error">
            <div *ngIf="funcionarios.length === 0" class="alert alert-info">Nenhum funcionário cadastrado.</div>

            <div *ngIf="funcionarios.length > 0" class="table-responsive">
              <table class="table table-striped">
                <thead>
                  <tr>
                    <th>Matrícula</th>
                    <th>Nome</th>
                    <th>CPF</th>
                    <th>Telefone</th>
                    <th>Ações</th>
                  </tr>
                </thead>
                <tbody>
                  <tr *ngFor="let funcionario of funcionarios">
                    <td>{{ funcionario.matricula }}</td>
                    <td>{{ funcionario.nome || funcionario.name }}</td>
                    <td>{{ funcionario.cpf }}</td>
                    <td>{{ funcionario.telefone }}</td>
                    <td>
                      <button class="btn btn-sm btn-outline-primary mr-1" (click)="editarFuncionario(funcionario)" title="Editar">
                        <i class="fa fa-edit"></i>
                      </button>
                      <button class="btn btn-sm btn-outline-danger" (click)="excluirFuncionario(funcionario)" title="Excluir">
                        <i class="fa fa-trash"></i>
                      </button>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
