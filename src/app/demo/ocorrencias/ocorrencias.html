<div class="container-fluid">
  <div class="row">
    <div class="col-sm-12">
      <div class="card">
        <div class="card-header">
          <h5>Lista de Ocorrências</h5>
          <div class="card-header-right">
            <button class="btn btn-primary" (click)="adicionarOcorrencia()">
              <i class="fa fa-plus"></i>
              Nova Ocorrência
            </button>
          </div>
        </div>
        <div class="card-body">
          <!-- Loading -->
          <div *ngIf="loading" class="text-center">
            <div class="spinner-border" role="status">
              <span class="sr-only">Carregando...</span>
            </div>
            <p>Carregando ocorrências...</p>
          </div>

          <!-- Error -->
          <div *ngIf="error" class="alert alert-danger">
            {{ error }}
            <button class="btn btn-sm btn-outline-danger ml-2" (click)="carregarOcorrencias()">Tentar Novamente</button>
          </div>

          <!-- Lista de ocorrências -->
          <div *ngIf="!loading && !error">
            <div *ngIf="ocorrencias.length === 0" class="alert alert-info">Nenhuma ocorrência cadastrada.</div>

            <div *ngIf="ocorrencias.length > 0" class="table-responsive">
              <table class="table table-striped">
                <thead>
                  <tr>
                    <th>Data</th>
                    <th>Placa</th>
                    <th>Motivo</th>
                    <th>Foto</th>
                    <th>Ações</th>
                  </tr>
                </thead>
                <tbody>
                  <tr *ngFor="let ocorrencia of ocorrencias">
                    <td>{{ formatarData(ocorrencia.criado_em) }}</td>
                    <td>{{ ocorrencia.placa }}</td>
                    <td>{{ ocorrencia.motivo }}</td>
                    <td>
                      <a
                        *ngIf="ocorrencia.foto"
                        [href]="ocorrencia.foto"
                        target="_blank"
                        class="badge badge-success foto-clicavel"
                        title="Clique para visualizar a foto"
                      >
                        <i class="fa fa-camera"></i>
                        Ver Foto
                      </a>
                      <span *ngIf="!ocorrencia.foto" class="badge badge-warning">
                        <i class="fa fa-exclamation-triangle"></i>
                        Sem foto
                      </span>
                    </td>
                    <td>
                      <button class="btn btn-sm btn-outline-primary mr-1" (click)="editarOcorrencia(ocorrencia)" title="Editar">
                        <i class="fa fa-edit"></i>
                      </button>
                      <button class="btn btn-sm btn-outline-danger" (click)="excluirOcorrencia(ocorrencia)" title="Excluir">
                        <i class="fa fa-trash"></i>
                      </button>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
