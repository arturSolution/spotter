<div id="veiculo" class="card card-style2" style="border-radius: 50px 50px 20px 20px !important">
  <div class="card-body" (click)="detalhar(veiculo)">
    <h5 class="card-title">Detalhes de Veículo</h5>
    <ul>
      <li>{{veiculo.placa}}</li>
      <li>{{veiculo.marca}}</li>
      <li>{{veiculo.modelo}}</li>
      <li>{{veiculo.cor}}</li>
      <li>{{veiculo.tipo}}</li>
    </ul>
  </div>
</div>
